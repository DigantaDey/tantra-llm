[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tantra-llm"
version = "0.1.0"
description = "A reproducible Bengali Tantra OCR cleanup and CPU GGUF workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "internetarchive>=5.5,<6",
  "psutil>=5.9",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
runtime = ["llama-cpp-python>=0.3"]
dev = ["ruff>=0.6"]

[project.scripts]
tantra-scrape = "scraper:main"
tantra-clean = "cleaner:main"
tantra-train-corrector = "train_corrector:main"
tantra-chat = "app:main"
tantra-benchmark = "benchmark:main"

[tool.setuptools]
py-modules = [
  "app",
  "benchmark",
  "cleaner",
  "neural_corrector",
  "scraper",
  "train_corrector",
]

[tool.setuptools.data-files]
"share/tantra-llm/data" = ["data/tantra_terms.txt"]
