name: Live probe (temporary diagnostic)

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  probe:
    name: Probe live archive.org
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests internetarchive
      - name: Run probe
        run: python probe_archive.py 2>&1 | tee probe_results.txt
      - name: Commit results back to branch
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add probe_results.txt
          git commit -m "probe results [skip ci]" || echo "nothing to commit"
          git push
