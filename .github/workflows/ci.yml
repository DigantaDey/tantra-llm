name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and shell checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install "ruff==0.17.0"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Shell syntax and shellcheck (quantize.sh, setup.sh)
        run: |
          bash -n quantize.sh
          bash -n setup.sh
          shellcheck quantize.sh
          shellcheck setup.sh

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only PyTorch keeps the install small. The unit tests never need a GPU.
      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q

  live-archive:
    name: Live archive.org integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the core dependencies: the scraper and the live tests need no PyTorch.
      - name: Install project and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      # The contract with archive.org - query shape, JSON field types, MD5-verified
      # downloads - is checked against the live service on every PR, with retries
      # to tolerate transient archive.org hiccups.
      - name: Live tests (search, metadata, MD5-verified download)
        run: python -m pytest -m live tests/test_live_archive.py -v

  test-macos:
    name: Tests (macOS, Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # On macOS the PyPI wheel is the CPU build; there is no separate CPU index.
      - name: Install PyTorch
        run: python -m pip install --upgrade pip torch

      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"

      # The suite runs quantize.sh end to end with stub tools, so this also exercises
      # the BSD userland and the stock bash 3.2 that macOS ships.
      - name: pytest
        run: python -m pytest -q

  apple-silicon-runtime:
    name: Chat runtime build (macOS, Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # This is the exact install path a Mac user follows; llama-cpp-python is compiled
      # from source with the Metal backend, which is the step that most often breaks locally.
      - name: Install project with the chat runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[llm]"

      - name: Runtime imports and entry points
        run: |
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"
          python -c "from tantra.llm import LlamaCppBackend, gpu_offload_supported; print('gpu offload:', gpu_offload_supported())"
          python app.py --help
          python benchmark.py --help
          python fetch_model.py --help

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist .

      # Smoke-test the wheel with core dependencies only. tantra-clean needs torch and is covered by the test job.
      - name: Check the wheel installs and runs
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/tantra-scrape --help > /dev/null
          /tmp/wheel-check/bin/tantra-fetch --help > /dev/null
