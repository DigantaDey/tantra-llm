name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tool
        run: python -m pip install ruff
      - name: Lint Python sources
        run: ruff check scraper.py cleaner.py train_corrector.py neural_corrector.py app.py benchmark.py tests
      - name: Compile Python sources
        run: python -m compileall -q scraper.py cleaner.py train_corrector.py neural_corrector.py app.py benchmark.py tests
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate quantization shell syntax
        run: bash -n quantize.sh
      - name: Check patch whitespace
        run: git diff --check
